<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../CSS/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../assets/logo.png" width="40px">
            <span>TaskFlow</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" title="Cerrar"><a href="/index.html">✕</a></button>
        </div>
    </header>

    <main style="display:flex;align-items:center;justify-content:center;">
        <div class="login-window raised">
            <div class="login-titlebar">
                <span>Iniciar sesión - TaskFlow</span>
                <button class="login-close" title="Cerrar" onclick="window.location.href='../index.html'">✕</button>
            </div>
            <div class="login-body">
                <div id="loginAlert" class="alert alert-danger d-none" role="alert">
                    Usuario y contraseña son obligatorios.
                </div>
                <form class="login-form" id="loginForm">
                    <label for="loginUser">Usuario</label>
                    <input type="text" id="loginUser" name="loginUser" autocomplete="username">

                    <label for="loginPass">Contraseña</label>
                    <input type="password" id="loginPass" name="loginPass" autocomplete="current-password">

                    <div class="login-options">
                        <label class="login-checkbox">
                            <input type="checkbox" id="rememberMe"> Recordar contraseña
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="loginOkBtn">OK</button>
                        <button type="button" id="loginCancelBtn" onclick="window.location.href='../index.html'">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer-grid">
        <div class="footer-column" id="footerLeft"></div>
        <div class="footer-column" id="footerRight"></div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.querySelector('#loginForm');
            const user = document.querySelector('#loginUser');
            const pass = document.querySelector('#loginPass');
            const alertBox = document.querySelector('#loginAlert');

            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const u = user ? user.value.trim() : '';
                    const p = pass ? pass.value.trim() : '';

                    console.log('login user: ' + u);
                    console.log('login pass: ' + p);

                    if (u === '' || p === '') {
                        if (alertBox) alertBox.classList.remove('d-none');
                    } else {
                        if (alertBox) alertBox.classList.add('d-none');
                        console.log('Login válido');
                        window.location.href = '../index.html';
                    }
                });
            }

            const cancelBtn = document.querySelector('#loginCancelBtn');
            if (cancelBtn) {
                cancelBtn.addEventListener('click', function () {
                    if (alertBox) alertBox.classList.add('d-none');
                });
            }
        });
    </script>
</body>
</html>
